<!doctype html>
<html lang="en-GB">
  <head>
    <script>
      (() => {
        const param = new URLSearchParams(window.location.search).get("scoutTheme");
        const theme =
          param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
        if (!document.documentElement.hasAttribute("data-accent")) document.documentElement.setAttribute("data-accent", "teal");
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Verse Recall by Made by Favor. A quiet place to learn Scripture, practise recall, and return to the words you keep." />
    <meta name="theme-color" content="#0f6b66" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Verse Recall — Bible Memory</title>
    <style>
      :root {
        color-scheme: light;
        --cp-bg: #f7f4ef;
        --cp-bg-elevated: #fcfbf8;
        --cp-surface: #ffffff;
        --cp-surface-soft: #f3f1ec;
        --cp-border: #dedad2;
        --cp-border-strong: #8a857c;
        --cp-text: #23211e;
        --cp-text-muted: #55524c;
        --cp-text-soft: #66625b;
        --cp-success: #15803d;
        --cp-danger: #c81e1e;
        --cp-warning: #a15c07;
        --cp-link: #0b5cad;
        --cp-shadow: 0 18px 48px rgba(35, 33, 30, 0.10);
        --cp-overlay: rgba(247, 244, 239, 0.82);
        --cp-accent: #0f6b66;
        --cp-accent-hover: #0b5551;
        --cp-accent-fg: #ffffff;
        --cp-accent-soft: rgba(15, 107, 102, 0.08);
        --cp-highlight: rgba(15, 107, 102, 0.12);
        --cp-focus: #0f6b66;
      }
      html[data-theme="dark"] {
        color-scheme: dark;
        --cp-bg: #1f1d1b;
        --cp-bg-elevated: #262422;
        --cp-surface: #2b2927;
        --cp-surface-soft: #33302d;
        --cp-border: #45413c;
        --cp-border-strong: #857f76;
        --cp-text: #ece8e1;
        --cp-text-muted: #bdb7ad;
        --cp-text-soft: #aaa49a;
        --cp-success: #4ade80;
        --cp-danger: #f87171;
        --cp-warning: #fbbf24;
        --cp-link: #8cc4ff;
        --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.36);
        --cp-overlay: rgba(20, 19, 18, 0.86);
        --cp-accent: #7fd6cc;
        --cp-accent-hover: #a7e6de;
        --cp-accent-fg: #1a1a1a;
        --cp-accent-soft: rgba(127, 214, 204, 0.14);
        --cp-highlight: rgba(127, 214, 204, 0.12);
        --cp-focus: #7fd6cc;
      }
      body { margin: 0; background: var(--cp-bg); color: var(--cp-text); }
    </style>
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <div id="app"></div>
    <noscript>Verse Recall needs JavaScript for its local exercises. No account is needed, and it keeps working offline after your first visit.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
